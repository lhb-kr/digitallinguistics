<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your Shakespeare</title>
<style>
  :root {
    --bg: #f6f7f3;
    --panel: #ffffff;
    --panel-soft: #eef4f0;
    --ink: #18211f;
    --muted: #62706c;
    --line: #d8dfd7;
    --line-strong: #b8c3bd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100vh;
  }
  .container { max-width: 980px; margin: 0 auto; padding: 32px 24px 80px; }
  header.title-block { text-align: center; margin-bottom: 36px; }
  header.title-block .eyebrow { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  header.title-block h1 { font-size: 2.2rem; margin: 0 0 8px; font-weight: 600; letter-spacing: -0.02em; }
  header.title-block p { font-size: 1rem; color: var(--muted); margin: 0; max-width: 56ch; margin-left: auto; margin-right: auto; }

  /* Stepper */
  .stepper-track { display: flex; align-items: center; gap: 0; justify-content: center; margin-bottom: 32px; }
  .step-dot {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--bg);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.82rem; font-weight: 600;
    transition: all 0.3s;
    flex-shrink: 0;
  }
  .step-dot.is-active { border-color: var(--ink); background: var(--ink); color: #fff; }
  .step-dot.is-done { border-color: #0f766e; background: #0f766e; color: #fff; }
  .step-line { width: 50px; height: 2px; background: var(--line); transition: background 0.3s; }
  .step-line.is-done { background: #0f766e; }

  /* Card */
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 32px;
    box-shadow: 0 12px 40px rgba(24,33,31,0.06);
  }
  .question h2 { margin: 0 0 6px; font-size: 1.4rem; font-weight: 600; letter-spacing: -0.01em; }
  .question .sub { color: var(--muted); margin: 0 0 22px; font-size: 0.94rem; }

  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .options.solo { grid-template-columns: repeat(2, 1fr); }
  .option {
    cursor: pointer;
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    text-align: left;
    transition: all 0.18s;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font: inherit;
    color: inherit;
  }
  .option:hover { border-color: var(--line-strong); transform: translateY(-1px); }
  .option.is-selected { border-color: var(--ink); background: var(--panel-soft); }
  .option .opt-label { font-weight: 600; font-size: 0.98rem; }
  .option .opt-sub { color: var(--muted); font-size: 0.84rem; line-height: 1.4; }

  /* Nav buttons */
  .nav-row {
    margin-top: 28px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .btn {
    cursor: pointer;
    padding: 11px 22px;
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    font-size: 0.94rem;
    transition: all 0.16s;
    border: 2px solid var(--line);
    background: #fff;
    color: var(--ink);
  }
  .btn:hover:not(:disabled) { border-color: var(--ink); }
  .btn.primary {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .btn.primary:hover { background: #2a3835; border-color: #2a3835; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Result panel */
  .result-shell { animation: fade-up 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes fade-up { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }

  .result-eyebrow { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  .result-title { font-size: 2.4rem; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.02em; }
  .result-type {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 18px;
  }
  .result-desc { font-size: 1rem; color: var(--ink); margin: 0 0 18px; max-width: 62ch; }
  .result-fit { font-size: 0.92rem; color: var(--muted); margin: 0 0 24px; max-width: 62ch; }
  .result-fit strong { color: var(--ink); }

  .result-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    gap: 24px;
    margin-top: 24px;
  }
  @media (max-width: 760px) { .result-layout { grid-template-columns: 1fr; } }

  .arc-host { background: var(--panel-soft); border-radius: 12px; padding: 14px; }
  .arc-host svg { display: block; width: 100%; height: auto; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-box {
    background: var(--panel-soft);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .stat-box .k {
    font-size: 0.7rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.04em;
    font-weight: 600; margin-bottom: 4px;
  }
  .stat-box .v { font-size: 1.05rem; font-weight: 600; }

  .alt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .alt-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.16s;
  }
  .alt-card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
  .alt-card .alt-rank { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .alt-card .alt-title { font-weight: 600; margin: 2px 0; font-size: 1rem; }
  .alt-card .alt-type { font-size: 0.82rem; color: var(--muted); }

  .characters-line { font-size: 0.86rem; color: var(--muted); margin-top: 10px; }
  .characters-line strong { color: var(--ink); }

  /* SVG arc styles */
  .arc-path { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .axis-line { stroke: #b8c3bd; stroke-width: 1; }
  .axis-tick { stroke: #d8dfd7; stroke-width: 0.5; }
  .axis-text { font-size: 10px; fill: #62706c; }
  .zero-line { stroke: #b8c3bd; stroke-width: 1; stroke-dasharray: 2 3; }
  .arc-marker {
    fill: #b8c3bd; stroke: #fff; stroke-width: 1.5;
    opacity: 0;
    animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes pop-in {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.4); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .reset-link {
    display: inline-block;
    margin-top: 32px;
    color: var(--muted);
    font-size: 0.88rem;
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
  }
  .reset-link:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="container">
  <header class="title-block">
    <div class="eyebrow">Curated by emotional flow + character network</div>
    <h1>Find Your Shakespeare</h1>

// ------- Question definitions -------
// Each option assigns "weight" deltas to feature dimensions used in matching
const QUESTIONS = [
  {
    id: 'mood',
    title: 'What kind of emotional experience do you want?',
    sub: 'There is no wrong answer — pick what fits your current mood.',
    options: [
      { id: 'cathartic',  label: 'Catharsis — let me feel something deeply', sub: 'Even if it ends in tears', target: { mean: -0.25, range: 1.0, direction: -0.5 } },
      { id: 'resolved',   label: 'Hope — I want a journey that resolves',     sub: 'Difficulty followed by arrival',  target: { mean: 0.0,  range: 0.7, direction: 0.4 } },
      { id: 'playful',    label: 'Lightness — something playful or romantic', sub: 'Magic, mischief, love',           target: { mean: -0.05, range: 0.7, direction: -0.2 } },
      { id: 'turbulent',  label: 'Turbulence — keep me off-balance',          sub: 'Many swings, unpredictability',   target: { mean: -0.1, range: 0.8, direction: 0.0, crossings_mean: 10 } },
    ],
  },
  {
    id: 'scale',
    title: 'How much world do you want to enter?',
    sub: 'Big casts mean richer politics; small casts mean closer focus.',
    options: [
      { id: 'small',  label: 'Tight ensemble',  sub: '15–25 characters, everyone knows everyone',     target: { num_speakers: 20, density: 0.65 } },
      { id: 'medium', label: 'Mid-sized cast',  sub: '25–45 characters, room to breathe',             target: { num_speakers: 35, density: 0.35 } },
      { id: 'epic',   label: 'Vast world',      sub: '50+ characters, sprawling factions',            target: { num_speakers: 60, density: 0.18 } },
    ],

    id: 'situation',
    title: 'How will you be watching?',
    sub: 'This affects how much attention you have to give.',
    options: [
      { id: 'solo_focused',  label: 'Solo, focused', sub: 'Evening, quiet, full attention', },
      { id: 'shared',        label: 'With others',   sub: 'Family or friends, want shared payoff', },
      { id: 'background',    label: 'Background',    sub: 'Doing other things, easy in/out', },
      { id: 'short',         label: 'Quick',         sub: 'Have an hour or two, want compact', },
    ],
  },
  {
    id: 'priority',
    title: 'What matters most in a story?',
    sub: 'Pick the one that most pulls you in.',
    options: [
      { id: 'characters',  label: 'Complex characters', sub: 'I want to know people deeply' },
      { id: 'plot',        label: 'Twists and surprise', sub: 'Keep me guessing' },
      { id: 'language',    label: 'Beautiful language', sub: 'Poetry, monologues, wit' },
      { id: 'meaning',     label: 'Big ideas',          sub: 'Power, love, identity, mortality' },
    ],
  },
];

// ------- State -------
const state = {
  step: 0,
  answers: {},
};

// ------- Scoring -------
function clusterFitScore(play, answers) {
  // Compose target features from the user's choices
  let target = {};
  let weights = { mean: 1.5, range: 1.0, direction: 1.0, num_speakers: 0.8, density: 0.8, crossings_mean: 1.0 };
  for (const q of QUESTIONS) {
    const ans = answers[q.id];
    if (!ans) continue;
    const opt = q.options.find(o => o.id === ans);
    if (opt && opt.target) {
      for (const [k, v] of Object.entries(opt.target)) target[k] = v;
    }
  }
  // Distance: weighted Euclidean over normalized feature deltas
  // Normalize each feature against the canon's spread to make distances comparable
  const norms = {
    mean: 0.6, range: 1.0, direction: 1.5,
    num_speakers: 60, density: 0.7, crossings_mean: 12,
  };
  let dist = 0;
  for (const [k, t] of Object.entries(target)) {
    const w = weights[k] || 1.0;
    const n = norms[k] || 1.0;
    const d = (play[k] - t) / n;
    dist += w * d * d;
  }
  // Situation adjustments
  if (answers.situation === 'short' && play.word_count) {
    // Prefer shorter plays (≤ 22k words is "short" in this canon)
    dist += play.word_count > 24000 ? 1.5 : 0;
  }
  if (answers.situation === 'background') {
    // Background watching: prefer lower volatility (less to track)
    if (play.crossings_mean > 8) dist += 0.8;
  }
  if (answers.situation === 'shared' && play.crossings_first_last > 8) {
    // Many crossings = hard for group viewing
    dist += 0.5;
  }
  if (answers.priority === 'language' && play.word_count) {
    // Prefer plays with high wikipedia link count (more famous = more language-celebrated)
    if (play.wiki_links < 40) dist += 0.4;
  }
  if (answers.priority === 'characters' && play.num_speakers > 50) {
    // Too many characters = harder to know any deeply
    dist += 0.5;
  }
  return dist;
}

function recommend(answers) {
  const scored = DATA.plays.map(p => ({ play: p, dist: clusterFitScore(p, answers) }));
  scored.sort((a, b) => a.dist - b.dist);
  return scored;
}

// ------- Render -------
const stepTrack = document.getElementById('step-track');
const appEl = document.getElementById('app');

function renderStepper() {
  stepTrack.innerHTML = '';
  const total = QUESTIONS.length;
  for (let i = 0; i < total; i++) {
    const dot = document.createElement('div');
    dot.className = 'step-dot';
    dot.textContent = i + 1;
    if (i < state.step) dot.classList.add('is-done');
    else if (i === state.step) dot.classList.add('is-active');
    stepTrack.appendChild(dot);
    if (i < total - 1) {
      const line = document.createElement('div');
      line.className = 'step-line';
      if (i < state.step) line.classList.add('is-done');
      stepTrack.appendChild(line);
    }
  }
}

function renderQuestion() {
  const q = QUESTIONS[state.step];
  appEl.innerHTML = `
    <div class="card question">
      <h2>${q.title}</h2>
      <p class="sub">${q.sub}</p>
      <div class="options ${q.options.length === 2 ? 'solo' : ''}">
        ${q.options.map(o => `
          <button class="option ${state.answers[q.id] === o.id ? 'is-selected' : ''}" data-opt="${o.id}">
            <span class="opt-label">${o.label}</span>
            <span class="opt-sub">${o.sub}</span>
          </button>
        `).join('')}
      </div>
      <div class="nav-row">
        <button class="btn" id="back-btn" ${state.step === 0 ? 'disabled' : ''}>Back</button>
        <button class="btn primary" id="next-btn" ${!state.answers[q.id] ? 'disabled' : ''}>
          ${state.step === QUESTIONS.length - 1 ? 'Find my play →' : 'Next →'}
        </button>
      </div>
    </div>
  `;
  appEl.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => {
      state.answers[q.id] = btn.dataset.opt;
      renderQuestion();
    });
  });
  document.getElementById('back-btn').addEventListener('click', () => {
    if (state.step > 0) { state.step--; render(); }
  });
  document.getElementById('next-btn').addEventListener('click', () => {
    if (!state.answers[q.id]) return;
    if (state.step < QUESTIONS.length - 1) {
      state.step++;
      render();
    } else {
      state.step++;
      render();
    }
  });
}

function renderResult() {
  const ranked = recommend(state.answers);
  const top = ranked[0].play;
  const alts = ranked.slice(1, 5);
  const cluster = DATA.clusters[top.cluster];

  appEl.innerHTML = `
    <div class="card result-shell">
      <div class="result-eyebrow">Your match</div>
      <h2 class="result-title">${top.title}</h2>
      <div class="result-type" style="background:${hexAlpha(cluster.color, 0.14)}; color:${cluster.color};">${cluster.name} · ${cluster.tagline}</div>
      <p class="result-desc">${cluster.summary}</p>
      <p class="result-fit"><strong>Why this fits you:</strong> ${matchExplanation(top, state.answers)}</p>

      <div class="result-layout">
        <div>
          <div class="arc-host">
            <svg viewBox="0 0 680 320" id="arc-svg" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
          <p class="characters-line"><strong>Major characters:</strong> ${(top.main_characters || []).join(', ') || 'see play'}</p>
        </div>
        <div>
          <div class="stat-grid">
            <div class="stat-box"><div class="k">Cast size</div><div class="v">${top.num_speakers} speakers</div></div>
            <div class="stat-box"><div class="k">Network density</div><div class="v">${top.density.toFixed(2)}</div></div>
            <div class="stat-box"><div class="k">Year</div><div class="v">${top.year || '—'}</div></div>
            <div class="stat-box"><div class="k">Mean sentiment</div><div class="v">${top.mean.toFixed(2)}</div></div>
            <div class="stat-box"><div class="k">Emotional range</div><div class="v">${top.range.toFixed(2)}</div></div>
            <div class="stat-box"><div class="k">Oscillations</div><div class="v">${top.crossings_mean}</div></div>
          </div>

          <div style="margin-top:18px; font-size:0.85rem; color:var(--muted);">
            <strong style="color:var(--ink); display:block; margin-bottom:6px;">Best viewing situation</strong>
            ${cluster.viewing_situation}
          </div>
        </div>
      </div>

      <div style="margin-top:28px;">
        <div class="result-eyebrow" style="margin-bottom:10px;">Other plays you'd also enjoy</div>
        <div class="alt-grid">
          ${alts.map((a, i) => {
            const altCluster = DATA.clusters[a.play.cluster];
            return `
              <button class="alt-card" data-alt-title="${a.play.title}">
                <div class="alt-rank">Rank ${i + 2}</div>
                <div class="alt-title">${a.play.title}</div>
                <div class="alt-type" style="color:${altCluster.color}">${altCluster.name}</div>
              </button>
            `;
          }).join('')}
        </div>
      </div>

      <button class="reset-link" id="reset-btn">← Start over with new answers</button>
    </div>
  `;
  // Draw arc
  drawArc(top, cluster.color);
  // Alt clicks: regenerate result with that play forced to top
  appEl.querySelectorAll('.alt-card').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = btn.dataset.altTitle;
      const altIdx = DATA.plays.findIndex(p => p.title === t);
      if (altIdx < 0) return;
      const forced = DATA.plays[altIdx];
      // Render that alt as top
      renderForced(forced, ranked);
    });
  });
  document.getElementById('reset-btn').addEventListener('click', () => {
    state.step = 0; state.answers = {}; render();
  });
}

function renderForced(forced, ranked) {
  // Replace top with chosen alt; keep others
  const newRanked = [{ play: forced, dist: 0 }, ...ranked.filter(r => r.play.title !== forced.title)];
  const top = newRanked[0].play;
  const alts = newRanked.slice(1, 5);
  const cluster = DATA.clusters[top.cluster];
  // Just re-render result body with this top
  appEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  renderResultFromOrdered(top, cluster, alts);
}
function renderResultFromOrdered(top, cluster, alts) {
  appEl.innerHTML = `
    <div class="card result-shell">
      <div class="result-eyebrow">Your match</div>
      <h2 class="result-title">${top.title}</h2>
      <div class="result-type" style="background:${hexAlpha(cluster.color, 0.14)}; color:${cluster.color};">${cluster.name} · ${cluster.tagline}</div>
      <p class="result-desc">${cluster.summary}</p>
      <p class="result-fit"><strong>Why this fits you:</strong> ${matchExplanation(top, state.answers)}</p>
      <div class="result-layout">
        <div>
          <div class="arc-host">
            <svg viewBox="0 0 680 320" id="arc-svg" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
          <p class="characters-line"><strong>Major characters:</strong> ${(top.main_characters || []).join(', ') || 'see play'}</p>
        </div>
        <div>
          <div class="stat-grid">
            <div class="stat-box"><div class="k">Cast size</div><div class="v">${top.num_speakers} speakers</div></div>
            <div class="stat-box"><div class="k">Network density</div><div class="v">${top.density.toFixed(2)}</div></div>
            <div class="stat-box"><div class="k">Year</div><div class="v">${top.year || '—'}</div></div>
            <div class="stat-box"><div class="k">Mean sentiment</div><div class="v">${top.mean.toFixed(2)}</div></div>
            <div class="stat-box"><div class="k">Emotional range</div><div class="v">${top.range.toFixed(2)}</div></div>
            <div class="stat-box"><div class="k">Oscillations</div><div class="v">${top.crossings_mean}</div></div>
          </div>
          <div style="margin-top:18px; font-size:0.85rem; color:var(--muted);">
            <strong style="color:var(--ink); display:block; margin-bottom:6px;">Best viewing situation</strong>
            ${cluster.viewing_situation}
          </div>
        </div>
      </div>
      <div style="margin-top:28px;">
        <div class="result-eyebrow" style="margin-bottom:10px;">Other plays you'd also enjoy</div>
        <div class="alt-grid">
          ${alts.map((a, i) => {
            const altCluster = DATA.clusters[a.play.cluster];
            return `
              <button class="alt-card" data-alt-title="${a.play.title}">
                <div class="alt-rank">Rank ${i + 2}</div>
                <div class="alt-title">${a.play.title}</div>
                <div class="alt-type" style="color:${altCluster.color}">${altCluster.name}</div>
              </button>
            `;
          }).join('')}
        </div>
      </div>
      <button class="reset-link" id="reset-btn">← Start over with new answers</button>
    </div>
  `;
  drawArc(top, cluster.color);
  appEl.querySelectorAll('.alt-card').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = btn.dataset.altTitle;
      const found = DATA.plays.find(p => p.title === t);
      if (found) renderForced(found, [{play: top, dist: 0}, ...alts]);
    });
  });
  document.getElementById('reset-btn').addEventListener('click', () => {
    state.step = 0; state.answers = {}; render();
  });
}

function matchExplanation(play, answers) {
  const parts = [];
  const mood = answers.mood;
  if (mood === 'cathartic' && play.range > 0.9) parts.push(`its emotional range of ${play.range.toFixed(2)} is wide enough to deliver real catharsis`);
  else if (mood === 'cathartic') parts.push(`its arc carries genuine emotional weight`);
  if (mood === 'resolved' && play.direction > 0.1) parts.push(`it ends ${play.direction.toFixed(2)} points higher than it began — a true rising arc`);
  if (mood === 'playful' && play.density > 0.5) parts.push(`its tight character network keeps the action lively`);
  if (mood === 'turbulent' && play.crossings_mean >= 8) parts.push(`it crosses its emotional mean ${play.crossings_mean} times — high turbulence`);

  const scale = answers.scale;
  if (scale === 'small' && play.num_speakers <= 25) parts.push(`compact cast of ${play.num_speakers}`);
  else if (scale === 'epic' && play.num_speakers >= 45) parts.push(`expansive cast of ${play.num_speakers} speakers`);
  else if (scale === 'medium' && play.num_speakers >= 25 && play.num_speakers <= 50) parts.push(`balanced cast of ${play.num_speakers}`);

  if (answers.situation === 'short' && play.word_count < 22000) parts.push(`it's relatively short`);

  if (!parts.length) parts.push(`its overall shape matched your answers most closely`);
  return parts.join('; ') + '.';
}

function drawArc(play, color) {
  const svg = document.getElementById('arc-svg');
  if (!svg || !play.arc.length) return;
  const W = 680, H = 320;
  const PAD = { l: 44, r: 24, t: 26, b: 34 };
  const plotW = W - PAD.l - PAD.r;
  const plotH = H - PAD.t - PAD.b;
  const yMin = -0.85, yMax = 0.85;
  const yScale = v => PAD.t + (1 - (v - yMin) / (yMax - yMin)) * plotH;
  const xScale = (i, n) => PAD.l + (i / (n - 1)) * plotW;

  let axes = '';
  [-0.5, 0, 0.5].forEach(t => {
    const y = yScale(t);
    axes += `<line class="axis-tick" x1="${PAD.l}" x2="${W - PAD.r}" y1="${y}" y2="${y}"/>`;
    axes += `<text class="axis-text" x="${PAD.l - 6}" y="${y + 3}" text-anchor="end">${t.toFixed(1)}</text>`;
  });
  axes += `<line class="zero-line" x1="${PAD.l}" x2="${W - PAD.r}" y1="${yScale(0)}" y2="${yScale(0)}"/>`;
  axes += `<line class="axis-line" x1="${PAD.l}" x2="${W - PAD.r}" y1="${H - PAD.b}" y2="${H - PAD.b}"/>`;
  [0, 25, 50, 75, 100].forEach(p => {
    const x = PAD.l + (p / 100) * plotW;
    axes += `<text class="axis-text" x="${x}" y="${H - PAD.b + 16}" text-anchor="middle">${p}%</text>`;
  });
  axes += `<text class="axis-text" x="${PAD.l + plotW/2}" y="${H - 4}" text-anchor="middle" style="font-weight:600">Play progress</text>`;
  axes += `<text class="axis-text" x="14" y="${PAD.t + plotH/2}" text-anchor="middle" style="font-weight:600" transform="rotate(-90 14 ${PAD.t + plotH/2})">Sentiment</text>`;

  const n = play.arc.length;
  const pts = play.arc.map((v, i) => `${xScale(i, n).toFixed(2)},${yScale(v).toFixed(2)}`);
  const d = `M${pts.join(' L')}`;

  // Endpoint markers
  const startX = xScale(0, n), startY = yScale(play.arc[0]);
  const endX = xScale(n - 1, n), endY = yScale(play.arc[n - 1]);

  svg.innerHTML = `
    ${axes}
    <path id="recommend-arc" class="arc-path" d="${d}" stroke="${color}"/>
    <circle class="arc-marker" cx="${startX}" cy="${startY}" r="5.5" style="fill:${color}; animation-delay:1.4s"/>
    <circle class="arc-marker" cx="${endX}" cy="${endY}" r="5.5" style="fill:${color}; animation-delay:1.7s"/>
    <text class="axis-text" x="${startX + 8}" y="${startY - 8}" style="font-weight:600; opacity:0; animation: pop-in 0.4s 1.5s forwards;">start ${play.arc[0].toFixed(2)}</text>
    <text class="axis-text" x="${endX - 8}" y="${endY - 8}" text-anchor="end" style="font-weight:600; opacity:0; animation: pop-in 0.4s 1.8s forwards;">end ${play.arc[n-1].toFixed(2)}</text>
  `;

  // Animate path drawing
  const path = svg.querySelector('#recommend-arc');
  const length = path.getTotalLength();
  path.style.strokeDasharray = length;
  path.style.strokeDashoffset = length;
  path.style.transition = 'none';
  void path.getBoundingClientRect();
  path.style.transition = 'stroke-dashoffset 1.4s cubic-bezier(0.4, 0, 0.2, 1)';
  path.style.strokeDashoffset = '0';
}

function hexAlpha(hex, a) {
  const m = hex.replace('#','');
  const r = parseInt(m.slice(0,2),16), g = parseInt(m.slice(2,4),16), b = parseInt(m.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

function render() {
  renderStepper();
  if (state.step < QUESTIONS.length) renderQuestion();
  else renderResult();
}
render();
